<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing</title>
    <style>
        /* Cài đặt nền tràn màn hình và căn giữa */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0f172a;
            display: flex;
            flex-direction: column; /* Sắp xếp vòng xoay và chữ theo chiều dọc */
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Hiệu ứng vòng xoay bên ngoài */
        .loader {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid transparent;
            border-top-color: #3b82f6;
            border-bottom-color: #3b82f6;
            animation: spin 1.5s linear infinite;
            position: relative;
            margin-bottom: 30px; /* Khoảng cách giữa vòng xoay và chữ */
        }

        /* Hiệu ứng vòng xoay bên trong */
        .loader::before {
            content: "";
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border-radius: 50%;
            border: 4px solid transparent;
            border-left-color: #38bdf8;
            border-right-color: #38bdf8;
            animation: spin-reverse 1s linear infinite;
        }

        /* Chữ hiển thị */
        .loading-text {
            color: #e2e8f0; /* Màu xám trắng hiện đại */
            font-size: 18px;
            letter-spacing: 1.5px;
            animation: pulse 1.5s infinite; /* Hiệu ứng chớp tắt nhẹ nhàng */
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes spin-reverse {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }

        /* Hiệu ứng nhịp đập cho chữ */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <div class="loader"></div>
    <div class="loading-text">We are Processing your feedback...</div>

    <script>
        // Link Larksuite đích
        const targetUrl = "https://upbasevn.sg.larksuite.com/app/ZvxKbl64sa67cJs7ZMnlT8wsgxf?from=from_copylink";
        
        // Tự động chuyển hướng sau 5000 mili-giây (5 giây)
        setTimeout(() => {
            window.location.href = targetUrl;
        }, 5000);
    </script>

</body>
</html>
